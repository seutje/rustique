[workspace]
members = [
    "crates/audio-engine",
    "crates/exporter",
    "crates/project-format",
    "crates/render-core",
    "crates/simulation", "gpu-smoke",
    "tools/particle-render",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

